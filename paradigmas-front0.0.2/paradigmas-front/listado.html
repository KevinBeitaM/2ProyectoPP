<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listado de Tareas | Sistema de Planificación</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

  <nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container d-flex justify-content-between">
      <span class="navbar-brand fw-bold text-primary fs-4">Listado de Tareas</span>
    </div>
  </nav>

  <div class="container">

    <div class="card shadow p-4">
      <h4 class="text-primary mb-3">Tareas Registradas</h4>

      <table class="table table-hover align-middle rounded table-bordered" id="tablaTareas">
        <thead class="table-primary">
          <tr>
            <th>Nombre</th>
            <th>Prioridad</th>
            <th>Tiempo</th>
            <th>Clima</th>
            <th>Depende de</th>
            <th>Fecha límite</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="text-center mt-4">
      <a href="index.html" class="btn btn-outline-secondary rounded-pill px-4">Volver</a>
    </div>

    <div class="text-center mt-3">
      <button id="btnVerificar" class="btn btn-outline-info rounded-pill px-4">
        Verificar Viabilidad
      </button>
    </div>

    <div class="text-center mt-3">
      <button id="btnOptimizar" class="btn btn-success rounded-pill px-4">
        Generar Plan Optimizado
      </button>
    </div>

    <div id="formViabilidad" class="card shadow-sm p-4 mt-4 mx-auto" style="max-width: 400px; display: none;">
      <h5 class="text-info mb-3">Verificar Viabilidad</h5>
      <form id="viabilidadForm">
        <div class="mb-3 text-start">
          <label class="form-label">Tiempo disponible (horas)</label>
          <input type="number" id="tiempoViabilidad" class="form-control" min="1" step="0.5" required>
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Clima actual</label>
          <select id="climaViabilidad" class="form-select">
            <option value="soleado">Soleado</option>
            <option value="nublado">Nublado</option>
            <option value="lluvioso">Lluvioso</option>
            <option value="cualquiera" selected>Indiferente</option>
          </select>
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary rounded-pill px-4">Verificar</button>
        </div>
      </form>
    </div>

    <div id="resultadoPlan" class="mt-5"></div>

  </div>

  <script src="js/script.js"></script>

</body>
</html>
