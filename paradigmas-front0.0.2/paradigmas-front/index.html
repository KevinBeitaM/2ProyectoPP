<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar Tarea | Sistema de Planificación</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

  <nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container d-flex justify-content-between">
      <span class="navbar-brand fw-bold text-primary fs-4">Sistema de Planificación</span>
    </div>
  </nav>

  <div class="container">
    <div class="card form-card mx-auto shadow p-4">
      <h4 class="text-primary mb-3">Registrar Nueva Tarea</h4>

      <form id="tareaForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="nombre">Nombre de la tarea</label>
            <input type="text" class="form-control form-control-modern" id="nombre" required>
          </div>

          <div class="col-md-3">
            <label class="form-label" for="prioridad">Prioridad</label>
            <select class="form-select form-control-modern" id="prioridad" required>
              <option value="">Seleccione...</option>
              <option value="alta">Alta</option>
              <option value="media">Media</option>
              <option value="baja">Baja</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label" for="tiempo">Tiempo estimado (horas)</label>
            <input type="number" class="form-control form-control-modern" id="tiempo" min="0.5" step="0.5" required>
          </div>

          <div class="col-md-4">
            <label class="form-label" for="clima">Clima</label>
            <select class="form-select form-control-modern" id="clima">
              <option value="soleado">Soleado</option>
              <option value="lluvioso">Lluvioso</option>
              <option value="nublado">Nublado</option>
              <option value="cualquiera">Indiferente</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label" for="dependencia">Depende de</label>
            <select class="form-select form-control-modern" id="dependencia">
              <option value="">Ninguna</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label" for="fechaLimite">Fecha y hora límite</label>
            <input type="datetime-local" class="form-control form-control-modern" id="fechaLimite">
          </div>

        </div>

        <div class="text-end mt-3">
          <button type="submit" class="btn btn-primary px-4 rounded-pill">Guardar</button>
        </div>
      </form>
    </div>

    <div class="text-center mt-4">
      <a href="listado.html" class="btn btn-outline-primary rounded-pill px-4">Ver listado de tareas</a>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
